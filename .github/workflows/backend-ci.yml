name: Backend CI

on:
  pull_request:
    branches:
      - main
    paths:
      - "apps/api/**"
      - "docker-compose.yml"
      - ".github/workflows/backend-ci.yml"

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: attesia_ci
          POSTGRES_USER: attesia
          POSTGRES_PASSWORD: attesia
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U attesia -d attesia_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      POSTGRES_DB: attesia_ci
      POSTGRES_USER: attesia
      POSTGRES_PASSWORD: attesia
      DB_HOST: localhost
      DB_PORT: "5432"

    defaults:
      run:
        working-directory: apps/api

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          version: "0.12.6"

      - name: Install Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --locked

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .

      - name: Django system check
        run: uv run python manage.py check

      - name: Check migrations
        run: uv run python manage.py makemigrations --check --dry-run

      - name: Test
        run: uv run pytest
