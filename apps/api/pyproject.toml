[project]
name = "api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "django>=6.1",
    "djangorestframework>=3.18.0",
    "psycopg[binary]>=3.3.4",
    "python-dotenv>=1.2.3",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-django>=4.14.0",
    "ruff>=0.16.4",
]

[tool.ruff.lint.per-file-ignores]
"**/migrations/*.py" = ["RUF012"]